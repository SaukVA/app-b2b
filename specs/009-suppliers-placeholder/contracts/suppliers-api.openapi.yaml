openapi: 3.0.3
info:
  title: App B2B · Listado de proveedores (provisional)
  version: 1.0.0
  description: >
    Contrato de la feature 009-suppliers-placeholder. En la implementación la ruta lleva su bloque JSDoc
    @openapi equivalente en apps/server/src/modules/suppliers/supplier.routes.ts y se sirve en /api-docs.
    Exige sesión (bearerAuth) y permiso de ver el módulo «proveedores» (editar incluye ver).
    En esta entrega toda petición válida responde con un listado vacío sin leer la base de datos (FR-009);
    la forma de la respuesta ya es la definitiva (FR-010).
    SuccessEnvelope, ErrorEnvelope y las respuestas ValidationError, Unauthenticated y Forbidden son las de
    contracts/auth-api.openapi.yaml de 001 y contracts/users-api.openapi.yaml de 003.
servers:
  - url: /api
tags:
  - name: Suppliers
security:
  - bearerAuth: []
paths:
  /suppliers:
    get:
      tags: [Suppliers]
      summary: Lista los proveedores con búsqueda, filtro de bajas y paginación
      description: >
        Provisional: devuelve siempre items vacío y total 0. Los parámetros desconocidos se ignoran.
      parameters:
        - name: q
          in: query
          description: Texto de búsqueda (nombre o CIF). Se recorta; vacío equivale a ausente.
          schema: { type: string, maxLength: 100 }
        - name: includeInactive
          in: query
          description: >
            true incluye también los proveedores dados de baja; false (por defecto), solo los activos.
            total cuenta los proveedores incluidos.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Página del listado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SupplierListPage' }
              example:
                success: true
                data: { items: [], total: 0, page: 1, pageSize: 10 }
        '400':
          description: VALIDATION_ERROR (texto de más de 100 caracteres, página o includeInactive no válidos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'page: Number must be greater than or equal to 1' }
        '401':
          description: AUTH_UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: AUTH_FORBIDDEN (el rol no puede ver Proveedores)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: DATABASE_UNAVAILABLE (solo backend embebido de escritorio sin base de datos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    SupplierListItem:
      type: object
      required: [id, name, leadTimeDays, yearPurchases, active]
      properties:
        id: { type: string }
        name: { type: string }
        leadTimeDays:
          type: integer
          minimum: 0
          nullable: true
          description: Plazo de entrega en días naturales; null si no se conoce.
        yearPurchases:
          type: number
          description: Compras sin IVA en euros con 2 decimales, del 1 de enero del año en curso hasta hoy.
        active:
          type: boolean
          description: false si el proveedor está dado de baja.
    SupplierListPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SupplierListItem' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [10] }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
