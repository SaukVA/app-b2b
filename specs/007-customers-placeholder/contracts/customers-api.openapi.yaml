openapi: 3.0.3
info:
  title: App B2B · Listado de clientes (provisional)
  version: 1.0.0
  description: >
    Contrato de la feature 007-customers-placeholder. En la implementación la ruta lleva su bloque JSDoc
    @openapi equivalente en apps/server/src/modules/customers/customer.routes.ts y se sirve en /api-docs.
    Exige sesión (bearerAuth) y permiso de ver el módulo «clientes» (editar incluye ver).
    En esta entrega toda petición válida responde con un listado vacío sin leer la base de datos (FR-009);
    la forma de la respuesta ya es la definitiva (FR-010).
    SuccessEnvelope, ErrorEnvelope y las respuestas ValidationError, Unauthenticated y Forbidden son las de
    contracts/auth-api.openapi.yaml de 001 y contracts/users-api.openapi.yaml de 003.
servers:
  - url: /api
tags:
  - name: Customers
security:
  - bearerAuth: []
paths:
  /customers:
    get:
      tags: [Customers]
      summary: Lista los clientes con búsqueda y paginación
      description: >
        Provisional: devuelve siempre items vacío y total 0. Los parámetros desconocidos se ignoran.
      parameters:
        - name: q
          in: query
          description: Texto de búsqueda (nombre o población). Se recorta; vacío equivale a ausente.
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Página del listado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CustomerListPage' }
              example:
                success: true
                data: { items: [], total: 0, page: 1, pageSize: 10 }
        '400':
          description: VALIDATION_ERROR (texto de más de 100 caracteres, página no válida)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                success: false
                error: { code: VALIDATION_ERROR, message: 'page: Number must be greater than or equal to 1' }
        '401':
          description: AUTH_UNAUTHENTICATED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: AUTH_FORBIDDEN (el rol no puede ver Clientes)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: DATABASE_UNAVAILABLE (solo backend embebido de escritorio sin base de datos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    CustomerListItem:
      type: object
      required: [id, name, city, maxRisk, balance, riskUsed, lastOrderDate]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string, nullable: true }
        maxRisk:
          type: number
          nullable: true
          description: Riesgo máximo en euros con 2 decimales; null o 0 = sin límite.
        balance: { type: number, description: Saldo pendiente en euros con 2 decimales }
        riskUsed:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Porcentaje del riesgo máximo usado por el saldo pendiente, redondeado (puede pasar de 100).
            null cuando el cliente no tiene límite.
        lastOrderDate:
          type: string
          format: date
          nullable: true
          description: Fecha del último pedido (YYYY-MM-DD); null si no hay pedidos.
    CustomerListPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerListItem' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, enum: [10] }
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
