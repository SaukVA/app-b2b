<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proveedores · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4430F}a:hover{color:#8A320A}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #B4430F;outline-offset:2px}
.mob{display:none}
.pv-row:hover{background:#F7F8F5!important}
.pv-back:hover{background:#EEF0EC!important}
@container app (max-width: 760px){
.nav{flex-direction:row!important;align-items:center!important;overflow-x:auto;padding:8px 12px!important;gap:4px!important;position:sticky;top:0;z-index:5}
.nav-user-info,.hide-m{display:none!important}
.nav>a{flex:none;white-space:nowrap}
.nav-push{margin-top:0!important}
.nav-user{flex:none;margin:0!important;padding:0 0 0 12px!important;border-top:0!important;border-left:1px solid #2C3238}
.nav-avatar{display:none!important}
.main{padding:16px 16px 32px!important;gap:16px!important}
.desk{display:none!important}
.mob{display:flex!important}
.pv-row,.pv-head{grid-template-columns:minmax(0,1fr) auto!important;padding-left:16px!important;padding-right:16px!important}
.pv-pad{padding:16px!important}
.pv-cols,.pv-formrow,.pv-q4{grid-template-columns:minmax(0,1fr)!important}
.pv-dl{grid-template-columns:minmax(0,1fr)!important;gap:2px!important}
}
</style>
</helmet>
<div style="width: 390px; min-height: 1800px; background: #F3F4F1">
<dc-import name="Proveedores" hint-size="390px,1800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
