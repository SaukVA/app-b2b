<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes · móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4430F}a:hover{color:#8A320A}
.mob{display:none}
.nav-dot,.nav-out-icon{display:none}
.nav-toggle svg{transition:transform .15s}
.nav.is-collapsed{flex:0 0 72px!important}
.is-collapsed .nav-brand{padding:4px 4px 24px!important}
.is-collapsed .nav-brand-text,.is-collapsed .nav-user-info{display:none!important}
.is-collapsed .nav-item{position:relative;padding:0!important;justify-content:center}
.is-collapsed .nav-label,.is-collapsed .nav-stamp{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:0!important;padding:0!important}
.is-collapsed .nav-item:hover .nav-label,.is-collapsed .nav-item:focus-visible .nav-label{left:56px;top:50%;transform:translateY(-50%);width:auto;height:auto;overflow:visible;clip:auto;padding:6px 10px!important;border-radius:6px;background:#262B31;color:#E8EAE6;font-size:13px;font-weight:500;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.is-collapsed .nav-dot{display:block}
.is-collapsed .nav-out-icon{display:block}
.is-collapsed .nav-user{padding:12px 0 4px!important;align-items:center}
.is-collapsed .nav-toggle{align-self:center}
.is-collapsed .nav-toggle svg{transform:rotate(180deg)}
@container app (max-width: 760px){
.nav{flex-direction:row!important;align-items:center!important;overflow-x:auto;padding:8px 12px!important;gap:4px!important;position:sticky;top:0;z-index:5}
.nav-brand{padding:0 8px 0 0!important}
.nav-brand-text,.nav-user-info,.hide-m{display:none!important}
.nav>a{flex:none;white-space:nowrap}
.nav-push{margin-top:0!important}
.nav-user{flex:none;margin:0!important;padding:0 0 0 12px!important;border-top:0!important;border-left:1px solid #2C3238}
.nav-user a{margin:0!important;white-space:nowrap}
.nav.is-collapsed{flex:1 1 auto!important}
.is-collapsed .nav-item{padding:0 12px!important}
.is-collapsed .nav-label,.is-collapsed .nav-stamp{position:static!important;width:auto!important;height:auto!important;overflow:visible!important;clip:auto!important}
.is-collapsed .nav-stamp{margin-left:8px!important;padding:0 6px!important}
.is-collapsed .nav-dot,.is-collapsed .nav-out-icon{display:none!important}
.main{padding:16px 16px 32px!important;gap:16px!important}
.desk{display:none!important}
.mob{display:flex!important}
.sup-row{grid-template-columns:minmax(0,1fr) auto!important;padding-left:16px!important;padding-right:16px!important}
.lg-hero{padding:16px 20px!important;gap:0!important}
.lg-main{padding:32px 16px 40px!important;align-items:flex-start!important}
}
</style>
</helmet>
<div style="width: 390px; min-height: 1300px; background: #F3F4F1">
<dc-import name="Ajustes" hint-size="390px,1300px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
