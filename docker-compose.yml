services:
  mongo:
    # 7.0 y no 8.0: MongoDB 8.0 no arranca con kernels Linux ≥ 6.19 (SERVER-121912). Volumen propio porque la
    # 7.0 no abre los datos que haya escrito la 8.0 en `mongo-data`.
    image: mongo:7.0
    container_name: app-b2b-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data-7:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Carga de un solo uso con los datos de demo (docker/mongo-seed/seed.js). Idempotente: se puede relanzar con
  # `docker compose run --rm mongo-seed`. MONGO_SEED_DB debe coincidir con la base de MONGODB_URI.
  mongo-seed:
    image: mongo:7.0
    container_name: app-b2b-mongo-seed
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo-seed:/seed:ro
    command:
      [
        'mongosh',
        'mongodb://mongo:27017/${MONGO_SEED_DB:-wholesale}',
        '--quiet',
        '--file',
        '/seed/seed.js',
      ]

volumes:
  mongo-data:
  mongo-data-7:
